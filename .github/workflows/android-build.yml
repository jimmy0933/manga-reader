name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lint
        continue-on-error: false

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        continue-on-error: false

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK (Unsigned/Debug-signed)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html
          retention-days: 30

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 30

      - name: Generate Job Summary
        run: |
          echo "## Android Build Success 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "1. **Debug APK:** \`app-debug-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "2. **Release APK:** \`app-release-unsigned-${{ github.sha }}\` (Note: Currently signed with debug key)" >> $GITHUB_STEP_SUMMARY
          echo "### How to Download" >> $GITHUB_STEP_SUMMARY
          echo "Go to the Actions tab, click on this run, and scroll down to the **Artifacts** section to download the APKs." >> $GITHUB_STEP_SUMMARY
